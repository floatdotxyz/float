[workspace]
resolver = "2"
members = ["crates/*", "programs/*"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/float-community/float-community"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
