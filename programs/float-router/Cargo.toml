[package]
name = "float-router"
version = "0.1.0"
description = "Community reference implementation of Float's on-chain fee router: coin registry, ticker escrow, Raydium LaunchLab/CPMM fee claims, five-way split, guarded conversions, $FLOAT buyback & burn, holder payouts and merkle airdrops."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "float_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
float-core = { path = "../../crates/float-core" }
solana-security-txt = "1.1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
